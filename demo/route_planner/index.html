            // Draw one candidate card (shared by the candidate list and other views). lastRoutes[i] is card i's itinerary
            let nCards = 0;
            function addCandidate(path, tags) {
                const i = nCards++;
                if (i >= routes.length) lastRoutes.push(path);   // append the other views' itineraries
                // take departure and arrival from frames (reading the first or last trip directly would fail
                //   on DATA.trips[undefined] when that leg is a walk)
                const frames = buildAnimFrames(path, depMin);
                const realDep = frames[0][0];
                const realArr = frames[frames.length-1][0];
                const dur = realArr - realDep;

                const el = document.createElement('div');
                el.className = 'candidate';
                el.dataset.idx = i;
                // Merge continuations of the same through train (only the line name changes) into one row.
                //   Uses isContinuation like countTransfers, so the number of ride rows = transfers + 1
                //   (the number of trains ridden).
                const groups = [];
                for (let li = 0; li < path.length; li++) {
                    const leg = path[li];
                    if (leg.walk) { groups.push({ walk: true, min: leg.walkMin }); continue; }   // walking leg
                    const tr = DATA.trips[leg.tripIdx];
                    const prev = groups.length ? groups[groups.length - 1] : null;
                    if (prev && !prev.walk && getRouter().isContinuation(path.slice(0, li), leg.tripIdx)) {
                        if (prev.lines[prev.lines.length - 1] !== tr.l) prev.lines.push(tr.l);
                        if (prev.nums.indexOf(tripLabel(tr)) < 0) prev.nums.push(tripLabel(tr));
                        continue;
                    }
                    groups.push({ walk: false, lines: [tr.l], nums: [tripLabel(tr)], color: lineColor(tr.l) });
                }
                let legsHtml = '';
                for (const g of groups) {
                    if (g.walk) {
                        legsHtml += `<div class="leg"><div class="leg-dot" style="background:#888"></div>徒歩 ${g.min} 分</div>`;
                        continue;
                    }
                    const num = g.nums.join('／');
                    const through = g.lines.length > 1 ? '<span class="leg-through">直通</span>' : '';
                    legsHtml += `<div class="leg leg-ride"><div class="leg-dot" style="background:${g.color}"></div>`
                              + `${esc(g.lines.join('→'))} ${esc(num)}${through}</div>`;
                }
                const tagHtml = (tags && tags.length)
                    ? `<div>${tags.map(t => `<span class="vp-tag">${t}</span>`).join('')}</div>` : '';
                el.innerHTML = `
                    ${tagHtml}
                    <div class="cand-head">
                        <div>${fmtClock(realDep)} 発 → ${fmtClock(realArr)} 着</div>
                        <div class="total">${fmtDuration(dur)}</div>
                    </div>
                    <div class="cand-detail">乗換 ${getRouter().countTransfers(path)} 回${realDep > depMin ? `　<span style="color:#ffa657">出発まで ${fmtDuration(realDep - depMin)} 待ち</span>` : ''}</div>
                    <div class="cand-detail">${legsHtml}</div>
                `;
                el.onclick = () => selectCandidate(i);
                list.appendChild(el);
                return el;
            }
            const cardOf = [];
            for (let i = 0; i < routes.length; i++) cardOf.push(addCandidate(routes[i], null));

            // Other views (routes by viewpoint). If the candidate list has the same itinerary, just add the tag
            if (getRouter().PARAMS.VIEWPOINT_ROUTES) {
                const vps = getRouter().findRoutesByViewpoint(fromGids, toGids, depMin, { base: routes[0] });
                const sigOf = p => p.map(l => l.walk ? 'w' + l.boardStation + '-' + l.alightStation
                                                     : l.tripIdx + ':' + l.boardIdx + '-' + l.alightIdx).join('|');
                const known = {};
                for (let i = 0; i < routes.length; i++) known[sigOf(routes[i])] = i;
                const rest = [];
                for (const v of vps) {
                    if (!v.path) { rest.push(v); continue; }
                    const at = known[sigOf(v.path)];
                    if (at === undefined) { rest.push(v); continue; }
                    // itinerary already in the candidate list: add the tag to it
                    const card = cardOf[at];
                    const tagHtml = v.labels.map(t => `<span class="vp-tag">${t}</span>`).join('');
                    card.insertAdjacentHTML('afterbegin', `<div>${tagHtml}</div>`);
                }
                if (rest.length) {
                    const h = document.createElement('div');
                    h.className = 'vp-head';
                    h.textContent = 'ほかの見方';
                    list.appendChild(h);
                    for (const v of rest) {
                        if (v.path) { addCandidate(v.path, v.labels); continue; }
                        const n = document.createElement('div');
                        n.className = 'vp-none';
                        n.textContent = `${v.labels.join('・')}：行ける経路がありません`;
                        list.appendChild(n);
                    }
                }
            }
            selectCandidate(0);
        }, 50);
    }
    function selectCandidate(i) {
        for (const el of document.querySelectorAll('.candidate')) el.classList.remove('selected');
        document.querySelectorAll('.candidate')[i]?.classList.add('selected');
        showRoute(lastRoutes[i]);
    }

    document.getElementById('search-btn').onclick = runSearch;
    document.getElementById('reset-btn').onclick = () => {
        originInput.value = ''; destInput.value = '';
        document.getElementById('candidates-panel').style.display = 'none';
        document.getElementById('trip-panel').style.display = 'none';
        document.getElementById('control-panel').style.display = 'none';
        clearMap();
        map.setView([36.0, 137.0], 5);
    };
    originInput.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
    destInput.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });

    for (const btn of document.querySelectorAll('.preset')) {
        btn.onclick = () => {
            originInput.value = btn.dataset.o;
            destInput.value = btn.dataset.d;
            if (btn.dataset.t) timeInput.value = btn.dataset.t;
            runSearch();
        };
    }
    document.getElementById('play-btn').onclick = () => {
        if (!currentFrames) return;
        if (simTime >= currentArrMin) simTime = currentDepMin;
        playing = !playing;
        document.getElementById('play-btn').textContent = playing ? '❚❚ 一時停止' : '▶ 出発';
        lastFrame = performance.now();
    };
    document.getElementById('progress-slider').oninput = e => {
        if (!currentFrames) return;
        const pct = parseFloat(e.target.value) / 1000;
        simTime = currentDepMin + (currentArrMin - currentDepMin) * pct;
        updateAnim();
    };
    for (const btn of document.querySelectorAll('.speed-group .speed-btn')) {
        btn.onclick = () => {
            for (const b of document.querySelectorAll('.speed-group .speed-btn')) b.classList.remove('active');
            btn.classList.add('active');
            speed = parseFloat(btn.dataset.speed);
        };
    }
    // follow toggle
    function updateFollowBtn() {
        const b = document.getElementById('follow-btn');
        if (!b) return;
        b.classList.toggle('active', followMap);
        b.textContent = followMap ? '🎯 追従' : '⊘ 固定';
    }
    document.getElementById('follow-btn').onclick = () => {
        followMap = !followMap;
        updateFollowBtn();
        if (followMap && trainMarker) {
            map.panTo(trainMarker.getLatLng(), { animate: true });
        }
    };
})();
</script>
</body>
</html>
